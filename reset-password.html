<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Buat Password Baru - MyFinSync</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">

  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 8px;
      transition: 0.2s;
    }
    .back-link:hover { color: var(--primary); }
    .auth-desc { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.6; }
    .password-hint { font-size: 12px; color: #94a3b8; margin-top: 8px; display: flex; align-items: center; gap: 5px; }
    .password-hint.valid { color: #10b981; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <a href="login.html" class="btn-close-page" title="Tutup"><i class="fas fa-times"></i></a>

      <div class="auth-header">
        <h1>Buat Password Baru</h1>
      </div>

      <p class="auth-desc">Masukkan password baru untuk akun kamu. Pastikan minimal 6 karakter.</p>

      <form id="reset-password-form">
        <div class="form-group">
          <label>Password Baru</label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="new_password" class="form-control" placeholder="Masukkan password baru" required oninput="checkPasswordStrength()">
            <button type="button" class="toggle-password" onclick="togglePassword('new_password', this)">
              <i class="far fa-eye"></i>
            </button>
          </div>
          <div class="password-hint" id="pass-hint">
            <i class="fas fa-info-circle"></i> Minimal 6 karakter
          </div>
        </div>

        <div class="form-group">
          <label>Konfirmasi Password</label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="confirm_password" class="form-control" placeholder="Ulangi password baru" required>
            <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px;">
          Simpan Password Baru <i class="fas fa-check" style="margin-left: 8px;"></i>
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html">Kembali ke Login</a>
      </div>

    </div>
  </div>

  <div class="custom-modal-overlay" id="auth-alert-overlay"></div>
  <div class="custom-modal" id="auth-alert-modal">
    <div id="auth-alert-icon" style="font-size: 45px; margin-bottom: 10px;"></div>
    <h3 id="auth-alert-title" style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Judul</h3>
    <p id="auth-alert-message" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Pesan</p>
    <button onclick="closeAuthAlert()" class="btn-primary">OK Mengerti</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    function togglePassword(inputId, btnElement) {
      const input = document.getElementById(inputId);
      const icon = btnElement.querySelector('i');

      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function checkPasswordStrength() {
      const pass = document.getElementById('new_password').value;
      const hint = document.getElementById('pass-hint');

      if (pass.length >= 6) {
        hint.innerHTML = '<i class="fas fa-check-circle"></i> Password sudah aman';
        hint.classList.add('valid');
      } else {
        hint.innerHTML = '<i class="fas fa-info-circle"></i> Minimal 6 karakter';
        hint.classList.remove('valid');
      }
    }
  </script>

</body>
</html>
