<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Target Tabungan</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <style>
    .goals-content { padding-bottom: 100px; }
    .goals-wrapper {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">

    <header class="top-header" style="padding-bottom: 0;">
      <div class="user-greeting">
        <p>Wujudkan Impianmu</p>
        <h1>Target Tabungan</h1>
      </div>
    </header>

    <div class="goals-content">
      
      <section class="content-section" style="margin-top: 15px;">
        <div class="section-header">
          <h3>Buat Target Baru</h3>
        </div>
        <div class="card form-card">
          <form id="goal-form" class="inline-form">
            <input type="text" id="goal_name" placeholder="Nama Impian (Cth: HP Baru)" required>
            <input type="text" inputmode="numeric" id="goal_target" placeholder="Target Nominal (Rp)" required oninput="formatRupiah(this)">
            <input type="text" inputmode="numeric" id="goal_current" placeholder="Uang Terkumpul Saat Ini (Rp)" value="0" oninput="formatRupiah(this)">
            
            <button type="submit" class="btn-primary" style="background: #0ea5e9; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);">
              <i class="fas fa-bullseye"></i> Mulai Menabung
            </button>
          </form>
        </div>
      </section>

      <section class="content-section">
        <div class="section-header">
          <h3>Daftar Impian & Progress</h3>
        </div>
        <div class="goals-wrapper" id="goals-container">
        </div>
      </section>

    </div>

    <div class="custom-modal-overlay" id="nabung-modal-overlay"></div>
    <div class="custom-modal" id="nabung-modal">
      <div class="modal-header">
        <h3 style="font-size: 16px; color: var(--text-main);">Tambah Tabungan</h3>
        <button class="btn-close-modal" id="close-modal-btn"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Masukkan nominal uang yang akan disisihkan untuk target ini.</p>
        <input type="text" inputmode="numeric" id="nabung_amount" placeholder="Nominal (Cth: 50.000)" class="modal-input" oninput="formatRupiah(this)">
        <button id="confirm-nabung-btn" class="btn-primary" style="width: 100%; margin-top: 15px; background: var(--green);">
          <i class="fas fa-check"></i> Konfirmasi Nabung
        </button>
      </div>
    </div>

    <div class="custom-modal-overlay" id="alert-modal-overlay"></div>
    <div class="custom-modal" id="alert-modal">
      <div class="modal-body" style="text-align: center; padding: 10px 0;">
        <div id="alert-icon" style="font-size: 45px; color: var(--green); margin-bottom: 10px;"><i class="fas fa-check-circle"></i></div>
        <h3 id="alert-title" style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Berhasil</h3>
        <p id="alert-message" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Pesan di sini</p>
        <button onclick="closeCustomAlert()" class="btn-primary" style="width: 100%; background: var(--primary);">OK Mengerti</button>
      </div>
    </div>

    <div class="custom-modal-overlay" id="confirm-modal-overlay"></div>
    <div class="custom-modal" id="confirm-modal">
      <div class="modal-body" style="text-align: center; padding: 10px 0;">
        <div style="font-size: 45px; color: var(--red); margin-bottom: 10px;"><i class="fas fa-exclamation-circle"></i></div>
        <h3 style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Konfirmasi</h3>
        <p id="confirm-message" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Apakah Anda yakin?</p>
        <div style="display: flex; gap: 10px;">
          <button onclick="closeCustomConfirm(false)" style="flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: #f1f5f9; color: var(--text-muted);">Batal</button>
          <button onclick="closeCustomConfirm(true)" style="flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: var(--red); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);">Ya, Lanjutkan</button>
        </div>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a href="report.html" class="nav-item">
      <i class="fas fa-chart-pie"></i>
      <span>Laporan</span>
    </a>
    
    <div class="nav-item fab-wrapper">
      <button class="fab" id="main-fab">
        <i class="fas fa-plus"></i>
      </button>
      <div class="fab-menu" id="fab-menu">
        <a href="income.html" class="fab-action btn-income"><i class="fas fa-arrow-down"></i> Pemasukan</a>
        <a href="expense.html" class="fab-action btn-expense"><i class="fas fa-arrow-up"></i> Pengeluaran</a>
      </div>
    </div>

    <a href="planner.html" class="nav-item">
      <i class="fas fa-calculator"></i>
      <span>Planner</span>
    </a>
    <a href="goals.html" class="nav-item active"> 
      <i class="fas fa-bullseye"></i>
      <span>Target</span>
    </a>
  </nav>

  <div class="overlay" id="fab-overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/goals.js"></script>

  <script>
    const fab = document.getElementById('main-fab');
    const fabMenu = document.getElementById('fab-menu');
    const overlay = document.getElementById('fab-overlay');

    fab.addEventListener('click', () => {
      fab.classList.toggle('active');
      fabMenu.classList.toggle('active');
      overlay.classList.toggle('active');
    });

    overlay.addEventListener('click', () => {
      fab.classList.remove('active');
      fabMenu.classList.remove('active');
      overlay.classList.remove('active');
    });
  </script>
</body>
</html>
