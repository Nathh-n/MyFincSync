<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Lupa Password - MyFinSync</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">

  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 8px;
      transition: 0.2s;
    }
    .back-link:hover { color: var(--primary); }
    .auth-desc { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <a href="login.html" class="btn-close-page" title="Kembali"><i class="fas fa-times"></i></a>

      <div class="auth-header">
        <h1>Lupa Password?</h1>
      </div>

      <p class="auth-desc">Masukkan email yang terdaftar. Kami akan mengirimkan link untuk mengatur ulang password kamu.</p>

      <form id="forgot-password-form">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="forgot_email" class="form-control" placeholder="Masukkan email kamu" required>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          Kirim Link Reset <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>
        </button>
      </form>

      <div class="auth-footer">
        Ingat password? <a href="login.html">Kembali ke Login</a>
      </div>

    </div>
  </div>

  <div class="custom-modal-overlay" id="auth-alert-overlay"></div>
  <div class="custom-modal" id="auth-alert-modal">
    <div id="auth-alert-icon" style="font-size: 45px; margin-bottom: 10px;"></div>
    <h3 id="auth-alert-title" style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Judul</h3>
    <p id="auth-alert-message" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Pesan</p>
    <button onclick="closeAuthAlert()" class="btn-primary">OK Mengerti</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
