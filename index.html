<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyFinSync - Pencatatan Keuangan</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    :root {
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --card-bg: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    .mobile-wrapper {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }

    /* Latar Belakang Dekoratif Abstrak */
    .bg-shape {
      position: absolute;
      top: -100px;
      right: -50px;
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(16, 185, 129, 0.1));
      border-radius: 50%;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 30px;
      text-align: center;
    }

    /* Ikon Logo Besar di Tengah */
    .hero-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, var(--primary), #60a5fa);
      color: white;
      border-radius: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      margin: 0 auto 30px auto;
      box-shadow: 0 15px 30px rgba(59, 130, 246, 0.3);
      transform: rotate(-5deg); /* Efek miring sedikit agar dinamis */
    }

    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 15px;
      color: var(--text-main);
    }

    p {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* Daftar Fitur Unggulan */
    .features {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 50px;
      text-align: left;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: var(--bg-color);
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }

    .feature-item i {
      font-size: 20px;
      background: white;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .feature-item span {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
    }

    /* Tombol Aksi */
    .btn-primary {
      display: block;
      width: 100%;
      padding: 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 15px;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 18px;
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-secondary:hover {
      background: var(--bg-color);
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">
    <div class="bg-shape"></div>
    
    <div class="content">
      <div class="hero-icon">
        <i class="fas fa-wallet"></i>
      </div>
      
      <h1>MyFinSync</h1>
      <p>Aplikasi cerdas untuk mencatat pengeluaran, merencanakan budget, dan mewujudkan target tabunganmu dengan mudah.</p>
      
      <div class="features">
        <div class="feature-item">
          <i class="fas fa-chart-pie" style="color: #3b82f6;"></i>
          <span>Pantau Pemasukan & Pengeluaran</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-bullseye" style="color: #10b981;"></i>
          <span>Kelola dan Capai Target Tabungan</span>
        </div>
      </div>
      
      <div style="margin-top: auto;">
        <a href="register.html" class="btn-primary">Mulai Sekarang <i class="fas fa-arrow-right" style="margin-left: 5px;"></i></a>
        <a href="login.html" class="btn-secondary">Masuk ke Akun Saya</a>
      </div>
    </div>
  </div>

</body>
</html>
