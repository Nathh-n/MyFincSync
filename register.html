<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Daftar - MyFinSync</title>
    
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <a href="index.html" class="btn-close-page" title="Kembali"><i class="fas fa-times"></i></a>

      <div class="auth-header">
        <h1>Register</h1>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="full_name" class="form-control" placeholder="Siapa nama kamu?" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="Masukkan email aktif" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" class="form-control" placeholder="Buat password yang kuat" required oninput="checkPasswordStrength()">
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
              <i class="far fa-eye"></i>
            </button>
          </div>
          <div class="password-hint" id="pass-hint">
            <i class="fas fa-info-circle"></i> Minimal 6 karakter
          </div>
        </div>

        <div class="form-group">
          <label>Konfirmasi Password</label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="confirm_password" class="form-control" placeholder="Ulangi password yang sama" required oninput="checkPasswordStrength()">
            <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)">
              <i class="far fa-eye"></i>
            </button>
          </div>
          <div class="password-hint" id="confirm-hint">
            <i class="fas fa-info-circle"></i> Ulangi password di atas
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px;">
          Daftar Akun <i class="fas fa-user-plus" style="margin-left: 5px;"></i>
        </button>
      </form>

      <div class="auth-footer">
        Sudah punya akun? <a href="login.html">Login di sini</a>
      </div>

    </div>
  </div>

  <div class="custom-modal-overlay" id="auth-alert-overlay"></div>
  <div class="custom-modal" id="auth-alert-modal">
    <div id="auth-alert-icon" style="font-size: 45px; margin-bottom: 10px;"></div>
    <h3 id="auth-alert-title" style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Judul</h3>
    <p id="auth-alert-message" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Pesan</p>
    <button onclick="closeAuthAlert()" class="btn-primary">OK Mengerti</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    function togglePassword(inputId, btnElement) {
      const input = document.getElementById(inputId);
      const icon = btnElement.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function checkPasswordStrength() {
      const pass = document.getElementById('password').value;
      const confirmPass = document.getElementById('confirm_password').value;
      const hint = document.getElementById('pass-hint');
      const confirmHint = document.getElementById('confirm-hint');

      if (pass.length >= 6) {
        hint.innerHTML = '<i class="fas fa-check-circle"></i> Password sudah aman';
        hint.classList.add('valid');
      } else {
        hint.innerHTML = '<i class="fas fa-info-circle"></i> Minimal 6 karakter';
        hint.classList.remove('valid');
      }

      if (confirmPass.length === 0) {
        confirmHint.innerHTML = '<i class="fas fa-info-circle"></i> Ulangi password di atas';
        confirmHint.classList.remove('valid');
        confirmHint.classList.remove('error');
      } else if (pass === confirmPass) {
        confirmHint.innerHTML = '<i class="fas fa-check-circle"></i> Password cocok';
        confirmHint.classList.add('valid');
        confirmHint.classList.remove('error');
      } else {
        confirmHint.innerHTML = '<i class="fas fa-times-circle"></i> Password tidak cocok';
        confirmHint.classList.remove('valid');
        confirmHint.classList.add('error');
      }
    }
  </script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}</script>
</body>
</html>
