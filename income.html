<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catat Pemasukan</title>
    
  <link rel="icon" type="image/png" href="assets/favicon.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  
  <style>
    /* Styling khusus form transaksi */
    .top-header-back { display: flex; align-items: center; gap: 15px; padding: 24px 20px 16px 20px; }
    .top-header-back a { color: var(--text-main); font-size: 20px; text-decoration: none; }
    .top-header-back h1 { font-size: 20px; font-weight: 700; color: var(--text-main); }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .form-control { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; outline: none; background: #f8fafc; transition: 0.2s; }
    .form-control:focus { border-color: var(--green); background: white; box-shadow: 0 0 0 3px var(--green-light); }
    
    /* Input nominal raksasa khas aplikasi keuangan */
    .amount-input {
      font-size: 32px !important;
      font-weight: 800;
      color: var(--green) !important;
      text-align: center;
      padding: 20px !important;
      background: white !important;
    }
    .amount-input::placeholder { color: #a7f3d0; font-weight: 600; }

    /* Input Group untuk menyatukan teks dan tombol mic */
    .input-group {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: 0.2s;
    }
    .input-group:focus-within {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-light);
      background: white;
    }
    .input-group input {
      border: none;
      background: transparent;
      padding: 14px 16px;
      flex: 1;
      font-size: 14px;
      outline: none;
    }

    /* Tombol Mic Kecil di dalam Input - Desain Baru */
    .btn-mic-small {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      margin-right: 4px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
      transition: all 0.3s ease;
    }
    .btn-mic-small:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); 
    }
    .btn-mic-small:active {
      transform: translateY(1px);
    }

    /* OVERLAY AI RECORDER */
    .voice-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000;
    }

    /* Tombol Mic Besar di Overlay - Desain Baru */
    .mic-button-large {
      width: 130px; height: 130px; 
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      color: white; font-size: 48px; border: none; cursor: pointer;
      box-shadow: 0 12px 35px rgba(59, 130, 246, 0.35), inset 0 -4px 10px rgba(0,0,0,0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }
    .mic-button-large:hover {
      transform: scale(1.05);
    }
    .mic-button-large::before { 
      content: '';
      position: absolute;
      top: -15px; left: -15px; right: -15px; bottom: -15px;
      border: 2px dashed #93c5fd;
      border-radius: 50%;
      animation: spin 10s linear infinite;
      opacity: 0.5;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Animasi Recording Diperhalus (Menggunakan warna biru/standar rekaman karena ini bisa untuk income) */
    .mic-button-large.recording { 
      background: linear-gradient(135deg, #f87171, #ef4444); 
      box-shadow: 0 12px 35px rgba(239, 68, 68, 0.4);
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; 
    }
    .mic-button-large.recording::before {
      border-color: #fca5a5;
      animation: spin 5s linear infinite; 
    }
    @keyframes pulse-ring { 
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); } 
      50% { transform: scale(1.05); box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); } 
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } 
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper" style="background: white;">

    <header class="top-header-back">
      <a href="dashboard.html"><i class="fas fa-arrow-left"></i></a>
      <h1>Catat Pemasukan</h1>
    </header>

    <section class="content-section" style="padding-top: 10px;">
      <form id="income-form">
        
        <div class="form-group" style="margin-bottom: 25px;">
          <label style="text-align: center; color: var(--green);">Jumlah Pemasukan (Rp)</label>
          <input type="text" inputmode="numeric" id="amount" class="form-control amount-input" placeholder="0" required oninput="formatRupiah(this)">
        </div>

        <div class="form-group">
          <label>Judul Transaksi</label>
          <div class="input-group">
            <input type="text" id="title" placeholder="Cth: Gaji Bulanan, Jual Barang" required>
            <button type="button" class="btn-mic-small" onclick="openVoiceOverlay()" title="Catat dengan Suara">
              <i class="fas fa-microphone"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Tanggal</label>
          <input type="date" id="transaction_date" class="form-control" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label>Masuk ke Dompet</label>
            <select id="wallet_id" class="form-control" required><option value="">Pilih Dompet</option></select>
          </div>
          <div class="form-group">
            <label>Kategori</label>
            <select id="category_id" class="form-control" required><option value="">Pilih Kategori</option></select>
          </div>
        </div>

        <div class="form-group">
          <label>Catatan (Opsional)</label>
          <textarea id="description" class="form-control" placeholder="Tambahkan keterangan tambahan..." rows="3"></textarea>
        </div>

        <button type="submit" class="btn-primary" style="background: var(--green); width: 100%; padding: 16px; border-radius: 14px; font-size: 16px; margin-top: 15px; box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);">
          <i class="fas fa-arrow-down"></i> Simpan Pemasukan
        </button>

      </form>
    </section>

    <!-- MODAL KONFIRMASI -->
    <div class="custom-modal-overlay" id="confirm-modal-overlay"></div>
    <div class="custom-modal" id="confirm-modal">
      <div class="modal-body" style="text-align: center; padding: 10px 0;">
        <div style="font-size: 45px; color: var(--red); margin-bottom: 10px;"><i class="fas fa-exclamation-triangle"></i></div>
        <h3 style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Konfirmasi</h3>
        <p id="confirm-message" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Pesan konfirmasi</p>
        <div style="display: flex; gap: 10px;">
          <button onclick="closeCustomConfirm(false)" style="flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: #f1f5f9; color: var(--text-muted);">Batal</button>
          <button onclick="closeCustomConfirm(true)" style="flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: var(--red); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);">Tetap Lanjutkan</button>
        </div>
      </div>
    </div>

    <div class="voice-overlay" id="voice-overlay">
      <button class="mic-button-large" id="mic-btn-large" onclick="startRecording()">
        <i class="fas fa-microphone"></i>
      </button>
      <p id="instruction-text" style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-top: 30px; text-align: center;">Berbicara untuk mencatat transaksi</p>
      <p id="status-text" style="font-size: 13px; color: var(--primary); font-weight: 600; text-align: center; display: none; padding: 0 20px;"></p>
      <button type="button" onclick="closeVoiceOverlay()" style="margin-top: 40px; background: #e2e8f0; color: var(--text-main); font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-keyboard"></i> Ketik Manual
      </button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/transaction.js"></script>

  <script>
    document.getElementById('transaction_date').valueAsDate = new Date();
  </script>
</body>
</html>
