<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Laporan Keuangan</title>
    
  <link rel="icon" type="image/png" href="assets/favicon.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <style>
    /* Styling Filter Lebih Compact */
    .filter-card { background: var(--card-bg); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 5px; border: 1px solid var(--border); }
    .filter-card h3 { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    .filter-card select { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; color: var(--text-main); font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }
    .filter-card select:focus { border-color: var(--primary); }
    
    /* Summary Grid Lebih Compact & Modern */
    .report-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .summary-box { background: var(--card-bg); border-radius: 12px; padding: 12px; box-shadow: var(--shadow-sm); text-align: center; border: 1px solid var(--border); }
    .summary-box h4 { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-box p { font-size: 15px; font-weight: 700; }
    
    .net-box { grid-column: 1 / -1; background: linear-gradient(135deg, #f8fafc, #f1f5f9); padding: 14px; position: relative; }
    .net-box h4 { color: var(--text-main); font-weight: 700; font-size: 12px; margin-top: 5px; }
    .net-box p { font-size: 20px; color: var(--primary); font-weight: 800; margin-top: 2px;}

    .warning-glow { border: 1px solid var(--red) !important; background: var(--red-light) !important; }

    /* Tombol Animasi Insight */
    .insight-btn { position: absolute; top: 12px; right: 15px; background: transparent; border: none; font-size: 18px; cursor: pointer; transition: 0.2s; display: none; }
    .insight-btn:hover { transform: scale(1.1); }
    .pulse-animation { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

    /* Tombol Pagination */
    .btn-page { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-main); transition: 0.2s; }
    .btn-page:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .report-content { padding-bottom: 100px; }
  </style>
</head>
<body>

  <div class="mobile-wrapper">

    <header class="top-header" style="padding-bottom: 0;">
      <div class="user-greeting">
        <p>Analisis & Rekap</p>
        <h1>Laporan</h1>
      </div>
    </header>

    <div class="report-content">
      
      <section class="content-section">
        <div class="filter-card">
          <h3><i class="fas fa-calendar-alt text-primary"></i> Periode:</h3>
          <select id="period-filter">
            <option value="today">Hari Ini</option>
            <option value="weekly">Minggu Ini</option>
            <option value="monthly" selected>Bulan Ini</option>
            <option value="yearly">Tahun Ini</option>
            <option value="custom">Pilih Tanggal Manual</option>
          </select>
        </div>
        
        <div id="custom-date-container" style="display: none; gap: 10px; margin-top: 10px; background: var(--card-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border);">
          <div style="flex: 1;">
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">Dari Tanggal:</label>
            <input type="date" id="custom-start" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; outline: none;">
          </div>
          <div style="flex: 1;">
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">Sampai Tanggal:</label>
            <input type="date" id="custom-end" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; outline: none;">
          </div>
        </div>

        <p id="date-range-text" style="font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; font-style: italic; font-weight: 500;"></p>
      </section>

      <section class="content-section">
        <div class="section-header">
          <h3>Ringkasan Transaksi</h3>
        </div>
        <div class="report-summary-grid">
          <div class="summary-box">
            <h4><i class="fas fa-arrow-down text-green"></i> Pemasukan</h4>
            <p id="period-income" class="text-green">Rp 0</p>
          </div>
          <div class="summary-box">
            <h4><i class="fas fa-arrow-up text-red"></i> Pengeluaran</h4>
            <p id="period-expense" class="text-red">Rp 0</p>
          </div>
          <div class="summary-box net-box" id="period-net-card">
            <button id="insight-btn" class="insight-btn" onclick="showInsightAlert()" title="Lihat Analisis"></button>
            <h4>Arus Kas Bersih (Net Cash Flow)</h4>
            <p id="period-net-balance">Rp 0</p>
          </div>
        </div>
      </section>

      <section class="content-section">
        <div class="section-header">
          <h3>Rincian Transaksi</h3>
        </div>
        
        <div class="transaction-list" id="report-transaction-list"></div>
        
        <div id="pagination-controls" style="display: none; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 5px;">
          <button id="prev-page-btn" class="btn-page" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i> Prev</button>
          <span id="page-info" style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Page 1 of 1</span>
          <button id="next-page-btn" class="btn-page" onclick="changePage(1)">Next <i class="fas fa-chevron-right"></i></button>
        </div>
      </section>

    </div>

    <div class="custom-modal-overlay" id="alert-modal-overlay"></div>
    <div class="custom-modal" id="alert-modal">
      <div class="modal-body" style="text-align: center; padding: 10px 0;">
        <div id="alert-icon" style="font-size: 45px; margin-bottom: 10px;"></div>
        <h3 id="alert-title" style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Pesan</h3>
        <p id="alert-message" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;">Isi pesan</p>
        <button onclick="closeCustomAlert()" class="btn-primary" style="width: 100%; background: var(--primary);">Tutup</button>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a href="report.html" class="nav-item active"> <i class="fas fa-chart-pie"></i>
      <span>Laporan</span>
    </a>
    
    <div class="nav-item fab-wrapper">
      <button class="fab" id="main-fab">
        <i class="fas fa-plus"></i>
      </button>
      <div class="fab-menu" id="fab-menu">
        <a href="income.html" class="fab-action btn-income"><i class="fas fa-arrow-down"></i> Pemasukan</a>
        <a href="expense.html" class="fab-action btn-expense"><i class="fas fa-arrow-up"></i> Pengeluaran</a>
        <a href="transfer.html" class="fab-action" style="background: var(--primary);"><i class="fas fa-exchange-alt"></i> Transfer</a>
      </div>
    </div>

    <a href="planner.html" class="nav-item">
      <i class="fas fa-calculator"></i>
      <span>Planner</span>
    </a>
    <a href="goals.html" class="nav-item">
      <i class="fas fa-bullseye"></i>
      <span>Target</span>
    </a>
  </nav>

  <div class="overlay" id="fab-overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/report.js"></script>

  <script>
    const fab = document.getElementById('main-fab');
    const fabMenu = document.getElementById('fab-menu');
    const overlay = document.getElementById('fab-overlay');

    fab.addEventListener('click', () => {
      fab.classList.toggle('active');
      fabMenu.classList.toggle('active');
      overlay.classList.toggle('active');
    });

    overlay.addEventListener('click', () => {
      fab.classList.remove('active');
      fabMenu.classList.remove('active');
      overlay.classList.remove('active');
    });
  </script>
</body>
</html>
