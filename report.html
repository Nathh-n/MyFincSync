<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Laporan Keuangan</title>
    
  <link rel="icon" type="image/png" href="assets/favicon.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <style>
    /* Styling Filter Lebih Compact */
    .filter-card { background: var(--card-bg); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 5px; border: 1px solid var(--border); }
    .filter-card h3 { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    .filter-card select { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; color: var(--text-main); font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }
    .filter-card select:focus { border-color: var(--primary); }
    
    /* Summary Grid Lebih Compact & Modern */
    .report-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .summary-box { background: var(--card-bg); border-radius: 14px; padding: 16px; box-shadow: var(--shadow-sm); text-align: center; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
    .summary-box h4 { font-size: 11px; color: var(--text-muted); margin-bottom: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-box p { font-size: 16px; font-weight: 700; }

    .net-box { grid-column: 1 / -1; background: linear-gradient(135deg, #f8fafc, #f1f5f9); padding: 16px; }
    .net-box h4 { color: var(--text-main); font-weight: 700; font-size: 12px; margin-top: 0; }
    .net-box p { font-size: 22px; color: var(--primary); font-weight: 800; margin-top: 4px; }
    .net-header { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }

    .warning-glow { border: 1px solid var(--red) !important; background: var(--red-light) !important; }

    /* Tombol Animasi Insight - posisi di header flex, statik */
    .insight-btn { background: transparent; border: none; font-size: 15px; cursor: pointer; transition: 0.2s; display: none; padding: 2px; position: static; }
    .insight-btn:hover { transform: scale(1.1); }
    .pulse-animation { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

    /* Tombol Pagination */
    .btn-page { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-main); transition: 0.2s; }
    .btn-page:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .report-content { padding-bottom: 100px; }

    /* Input di dalam modal edit */
    .modal-input-styled {
      width: 100%; padding: 14px 16px; border: 1px solid var(--border);
      border-radius: 12px; font-size: 14px; outline: none;
      background: #f8fafc; margin-bottom: 12px; color: var(--text-main);
    }
    .modal-input-styled:focus { border-color: var(--primary); background: white; }
    select.modal-input-styled { cursor: pointer; }

    /* Tombol Edit Transaksi */
    .btn-edit-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #dbeafe;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 3px rgba(59, 130, 246, 0.1);
    }
    .btn-edit-action:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Helper class untuk Item Transaksi */
    .transaction-item {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .trx-header-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
      gap: 10px;
    }
    .transaction-detail { flex: 1; }
    .transaction-detail h4 { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 3px; display: flex; align-items: center; }
    .trx-meta { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .trx-meta b { color: #64748b; font-weight: 600; }
    .trx-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .trx-amount-rendered { font-size: 14px; font-weight: 700; }
    .trx-desc { font-size: 11px; color: var(--text-muted); font-style: italic; margin-top: 4px; }
    .savings-badge { background: #eff6ff; color: var(--primary); padding: 3px 6px; border-radius: 6px; font-size: 9px; font-weight: 700; margin-left: 5px; }

    /* Pengaturan Kontrol Tanggal Khusus (Custom Date) */
    .custom-date-container {
      display: none;
      gap: 10px;
      margin-top: 10px;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .custom-date-group { flex: 1; }
    .custom-date-group label { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .custom-date-group input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; outline: none; }

    #date-range-text { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; font-style: normal; font-weight: 500; }

    /* Panel Search & Filter */
    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
    }
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    .search-wrapper i {
      position: absolute;
      left: 12px;
      color: #94a3b8;
      font-size: 14px;
    }
    .search-wrapper input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      background: #f8fafc;
      outline: none;
      transition: 0.2s;
    }
    .search-wrapper input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px #bfdbfe;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .filter-grid select {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      background: #f8fafc;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .filter-grid select:focus { border-color: var(--primary); background: white; }
    .btn-reset-filter {
      grid-column: 1 / -1;
      background: #f1f5f9;
      color: var(--text-muted);
      border: none;
      padding: 9px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-reset-filter:hover { background: var(--red-light); color: var(--red); }

    /* Tombol Export */
    .btn-export {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: var(--green);
      border: 1px solid #d1fae5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 3px rgba(16, 185, 129, 0.15);
    }
    .btn-export:hover {
      background: var(--green);
      color: white;
      border-color: var(--green);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    /* Tab Bar Laporan */
    .report-tabs {
      display: flex;
      gap: 8px;
      padding: 4px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 16px 20px 0;
    }
    .tab-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn i { font-size: 13px; }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .report-tabs:not(:has(.tab-btn.active)) .tab-btn:hover {
      color: var(--primary);
      background: #eff6ff;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Timestamp ringkas di tab Rincian */
    .detail-range-stamp {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      font-weight: 500;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">

    <header class="top-header" style="padding-bottom: 0;">
      <div class="user-greeting">
        <p>Analisis & Rekap</p>
        <h1>Laporan</h1>
      </div>
    </header>

    <div class="report-tabs">
      <button class="tab-btn active" data-tab="summary" onclick="switchReportTab('summary')">
        <i class="fas fa-chart-pie"></i> Ringkasan
      </button>
      <button class="tab-btn" data-tab="detail" onclick="switchReportTab('detail')">
        <i class="fas fa-list"></i> Rincian
      </button>
    </div>

    <div class="report-content">

      <div class="tab-pane active" id="pane-summary">

      <section class="content-section">
        <div class="filter-card">
          <h3><i class="fas fa-calendar-alt text-primary"></i> Periode:</h3>
          <select id="period-filter">
            <option value="today">Hari Ini</option>
            <option value="weekly">Minggu Ini</option>
            <option value="monthly" selected>Bulan Ini</option>
            <option value="yearly">Tahun Ini</option>
            <option value="custom">Pilih Tanggal Manual</option>
          </select>
        </div>
        
        <div id="custom-date-container" class="custom-date-container">
          <div class="custom-date-group">
            <label>Dari Tanggal:</label>
            <input type="date" id="custom-start">
          </div>
          <div class="custom-date-group">
            <label>Sampai Tanggal:</label>
            <input type="date" id="custom-end">
          </div>
        </div>

        <p id="date-range-text"></p>
      </section>

      <section class="content-section">
        <div class="section-header">
          <h3>Ringkasan Transaksi</h3>
        </div>
        <div class="report-summary-grid">
          <div class="summary-box">
            <h4><i class="fas fa-arrow-down text-green"></i> Pemasukan</h4>
            <p id="period-income" class="text-green">Rp 0</p>
          </div>
          <div class="summary-box">
            <h4><i class="fas fa-arrow-up text-red"></i> Pengeluaran</h4>
            <p id="period-expense" class="text-red">Rp 0</p>
          </div>
          <div class="summary-box net-box" id="period-net-card">
            <div class="net-header">
              <h4>Arus Kas Bersih</h4>
              <button id="insight-btn" class="insight-btn" onclick="showInsightAlert()" title="Lihat Analisis"></button>
            </div>
            <p id="period-net-balance">Rp 0</p>
          </div>
        </div>
      </section>

      </div>

      <div class="tab-pane" id="pane-detail">

      <section class="content-section">
        <div class="section-header">
          <h3>Rincian Transaksi</h3>
          <button onclick="exportCSV()" class="btn-export"><i class="fas fa-download"></i> Export</button>
        </div>

        <p class="detail-range-stamp" id="detail-range-text"></p>

        <div class="filter-panel">
          <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Cari judul transaksi...">
          </div>
          <div class="filter-grid">
            <select id="filter-type">
              <option value="">Semua Tipe</option>
              <option value="income">Pemasukan</option>
              <option value="expense">Pengeluaran</option>
              <option value="transfer">Transfer</option>
            </select>
            <select id="filter-category">
              <option value="">Semua Kategori</option>
            </select>
            <select id="filter-wallet">
              <option value="">Semua Dompet</option>
            </select>
            <button onclick="resetFilters()" class="btn-reset-filter"><i class="fas fa-undo"></i> Reset Filter</button>
          </div>
        </div>

        <div class="transaction-list" id="report-transaction-list"></div>
        
        <div id="pagination-controls" style="display: none; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 5px;">
          <button id="prev-page-btn" class="btn-page" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i> Prev</button>
          <span id="page-info" style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Page 1 of 1</span>
          <button id="next-page-btn" class="btn-page" onclick="changePage(1)">Next <i class="fas fa-chevron-right"></i></button>
        </div>
      </section>

      </div>

    </div>

    <!-- Modals (Edit, Confirm, Alert) Tetap Sama -->
    <div class="custom-modal-overlay" id="edit-modal-overlay"></div>
    <div class="custom-modal" id="edit-modal">
      <div class="modal-header">
        <h3 style="font-size: 16px; color: var(--text-main);">Edit Transaksi</h3>
        <button class="btn-close-modal" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" style="text-align: left;">
        <input type="hidden" id="edit-id">
        <input type="hidden" id="edit-type">

        <label style="font-size: 12px; font-weight: bold; color: var(--text-main); display: block; margin-bottom: 6px;">Judul Transaksi</label>
        <input type="text" id="edit-title" placeholder="Cth: Makan Siang" class="modal-input-styled">

        <label style="font-size: 12px; font-weight: bold; color: var(--text-main); display: block; margin-bottom: 6px;">Jumlah (Rp)</label>
        <input type="text" inputmode="numeric" id="edit-amount" placeholder="0" class="modal-input-styled" oninput="formatRupiah(this)">

        <label style="font-size: 12px; font-weight: bold; color: var(--text-main); display: block; margin-bottom: 6px;">Tanggal</label>
        <input type="date" id="edit-date" class="modal-input-styled">

        <label style="font-size: 12px; font-weight: bold; color: var(--text-main); display: block; margin-bottom: 6px;">Dompet</label>
        <select id="edit-wallet" class="modal-input-styled"><option value="">Pilih Dompet</option></select>

        <label style="font-size: 12px; font-weight: bold; color: var(--text-main); display: block; margin-bottom: 6px;">Kategori</label>
        <select id="edit-category" class="modal-input-styled"><option value="">Pilih Kategori</option></select>

        <label style="font-size: 12px; font-weight: bold; color: var(--text-main); display: block; margin-bottom: 6px;">Catatan (Opsional)</label>
        <textarea id="edit-description" class="modal-input-styled" placeholder="Tambahkan keterangan..." rows="2"></textarea>

        <button id="save-edit-btn" class="btn-primary" style="width: 100%; margin-top: 5px; background: var(--primary); gap: 8px; display: inline-flex; align-items: center; justify-content: center;">
          <i class="fas fa-save"></i> Simpan Perubahan
        </button>
      </div>
    </div>

    <div class="custom-modal-overlay" id="confirm-modal-overlay"></div>
    <div class="custom-modal" id="confirm-modal">
      <div class="modal-body" style="text-align: center; padding: 10px 0;">
        <div style="font-size: 45px; color: var(--red); margin-bottom: 10px;"><i class="fas fa-exclamation-triangle"></i></div>
        <h3 style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Saldo Tidak Cukup</h3>
        <p id="confirm-message" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Pesan konfirmasi</p>
        <div style="display: flex; gap: 10px;">
          <button onclick="closeCustomConfirm(false)" style="flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: #f1f5f9; color: var(--text-muted);">Batal</button>
          <button onclick="closeCustomConfirm(true)" style="flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: var(--red); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);">Tetap Lanjutkan</button>
        </div>
      </div>
    </div>

    <div class="custom-modal-overlay" id="alert-modal-overlay"></div>
    <div class="custom-modal" id="alert-modal">
      <div class="modal-body" style="text-align: center; padding: 10px 0;">
        <div id="alert-icon" style="font-size: 45px; margin-bottom: 10px;"></div>
        <h3 id="alert-title" style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Pesan</h3>
        <p id="alert-message" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;">Isi pesan</p>
        <button onclick="closeCustomAlert()" class="btn-primary" style="width: 100%; background: var(--primary);">Tutup</button>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a href="report.html" class="nav-item active"> <i class="fas fa-chart-pie"></i>
      <span>Laporan</span>
    </a>
    
    <div class="nav-item fab-wrapper">
      <button class="fab" id="main-fab">
        <i class="fas fa-plus"></i>
      </button>
      <div class="fab-menu" id="fab-menu">
        <a href="income.html" class="fab-action btn-income"><i class="fas fa-arrow-down"></i> Pemasukan</a>
        <a href="expense.html" class="fab-action btn-expense"><i class="fas fa-arrow-up"></i> Pengeluaran</a>
        <a href="transfer.html" class="fab-action" style="background: var(--primary);"><i class="fas fa-exchange-alt"></i> Transfer</a>
      </div>
    </div>

    <a href="planner.html" class="nav-item">
      <i class="fas fa-calculator"></i>
      <span>Planner</span>
    </a>
    <a href="goals.html" class="nav-item">
      <i class="fas fa-bullseye"></i>
      <span>Target</span>
    </a>
  </nav>

  <div class="overlay" id="fab-overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/report.js"></script>

  <script>
    const fab = document.getElementById('main-fab');
    const fabMenu = document.getElementById('fab-menu');
    const overlay = document.getElementById('fab-overlay');

    fab.addEventListener('click', () => {
      fab.classList.toggle('active');
      fabMenu.classList.toggle('active');
      overlay.classList.toggle('active');
    });

    overlay.addEventListener('click', () => {
      fab.classList.remove('active');
      fabMenu.classList.remove('active');
      overlay.classList.remove('active');
    });
  </script>
</body>
</html>
